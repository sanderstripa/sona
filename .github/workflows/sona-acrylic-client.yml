name: Check desktop acrylic on Windows 11
on:
  push:
    branches: [codex/sona-acrylic-probe]
    paths: ['.github/workflows/sona-acrylic-client.yml','gecko/tests/native-acrylic-probe.py','gecko/tests/bookmarks-sidebar.py']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install pillow
      - run: python gecko/tests/native-acrylic-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-native-acrylic
          path: acrylic-*.png
  sona:
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install pillow marionette_driver
      - run: gh run download 44842914762 --name sona42-windows-x64-candidate --dir candidate
      - run: python gecko/tests/candidate-visual.py --sidebar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-sona-sidebar
          path: candidate-visual/
