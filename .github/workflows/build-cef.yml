name: Build Sona CEF installer from 767e119

on:
  push:
    branches: [codex/cef-installer-767e119]

permissions:
  contents: write
  actions: read

# Only fresh source builds can package or publish.
jobs:
  windows-cef:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BETA_VERSION: 1.156.0.30.84
      BETA_NUMBER: 84
      # This explicit source marker records the owner's requested 1.0.76 release.
      # Ordinary main pushes continue to build without publishing.
      AUTOMATED_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release 1.0.76]') }}
      SOULU_TEST_STORE_INSTALL: 1
      SOULU_REGRESSION_SKIP_FIRST_RUN: 1
      SOULU_TEST_DEFAULT_APPS: 1
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout Soulu
        uses: actions/checkout@v4
        with:
          ref: 767e11908299a09838f3209c0f36ffca4bc1756e
          path: browser

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Verify canonical generated geometry and typography
        if: ${{ env.AUTOMATED_RELEASE != 'true' }}
        shell: pwsh
        run: |
          python -m py_compile browser/scripts/test-cef-next-ui.py browser/scripts/test-cef-video-translation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/generate-geometry.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/generate-typography.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./browser/scripts/test-installer-version.ps1

      - name: Checkout official CEF project
        uses: actions/checkout@v4
        with:
          repository: chromiumembedded/cef-project
          ref: 3aec7049cf63a36876d7a6ef538842d6af314482
          path: cef-project

      - name: Pin the approved CEF distribution on a clean path
        shell: pwsh
        run: |
          if ((Test-Path cef-project/third_party/cef) -or (Test-Path cef-build)) {
            throw 'Clean build required: CEF distribution or build directory already exists'
          }
          $index = Invoke-RestMethod 'https://cef-builds.spotifycdn.com/index.json'
          $versions = @($index.windows64.versions | Where-Object {
            $_.cef_version -match '^156\.0\.30\+g6028375\+chromium-156\.0\.8078\.96$' -and
            $_.chromium_version -eq '156.0.8078.96' -and $_.channel -eq 'stable'
          })
          if ($versions.Count -ne 1) { throw 'Exactly one approved CEF distribution must exist; no fallback allowed' }
          $version = $versions[0].cef_version
          $archive = @($versions[0].files | Where-Object type -eq 'standard')
          if ($archive.Count -ne 1 -or $archive[0].sha1 -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Canonical CEF index must provide the exact standard archive and its SHA-1'
          }
          "SonaCefArchiveName=$($archive[0].name)" >> $env:GITHUB_ENV
          "SonaCefArchiveSha1=$($archive[0].sha1)" >> $env:GITHUB_ENV
          $cmakeFile = 'cef-project/CMakeLists.txt'
          $cmake = Get-Content $cmakeFile -Raw
          $pattern = 'set\(CEF_VERSION "[^"]+"\)'
          if ([regex]::Matches($cmake, $pattern).Count -ne 1) { throw 'CEF project version declaration changed' }
          $cmake = [regex]::Replace($cmake, $pattern, ('set(CEF_VERSION "' + $version + '")'))
          # Soulu needs the wrapper and examples, not upstream CEF test applications.
          # The project snapshot's test targets are incompatible with this distribution.
          foreach ($target in @('cefclient', 'cefsimple', 'gtest', 'ceftests')) {
            $line = 'add_subdirectory(${CEF_ROOT}/tests/' + $target + ')'
            if (!$cmake.Contains($line)) { throw "Upstream target declaration changed: $target" }
            $cmake = $cmake.Replace($line, '')
          }
          Set-Content $cmakeFile $cmake -Encoding utf8
          # Use the canonical index checksum: the CDN .sha1 sidecar can return
          # an empty response. Keep DownloadCEF's EXPECTED_HASH verification.
          $loaderFile = 'cef-project/cmake/DownloadCEF.cmake'
          $loader = Get-Content $loaderFile -Raw
          $hashDownload = 'file(DOWNLOAD "${CEF_DOWNLOAD_URL_ESCAPED}.sha1" "${CEF_DOWNLOAD_PATH}.sha1")'
          $hashRead = 'file(READ "${CEF_DOWNLOAD_PATH}.sha1" CEF_SHA1)'
          if (!$loader.Contains($hashDownload) -or !$loader.Contains($hashRead)) { throw 'CEF checksum loader changed' }
          $loader = $loader.Replace($hashDownload, '').Replace($hashRead, ('set(CEF_SHA1 "' + $archive[0].sha1 + '")'))
          Set-Content $loaderFile $loader -Encoding utf8
          Write-Host "Pinned CEF distribution: $version"

      - name: Verify canonical typography and bundled fonts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fonttools
          New-Item -ItemType Directory -Force browser/artifacts | Out-Null
          python browser/scripts/check-typography.py browser/artifacts/typography-static.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/verify-vot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build integrity-pinned local translation runtime
        shell: pwsh
        run: |
          python browser/scripts/build-translation-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare integrity-pinned local speech model
        shell: pwsh
        run: |
          python browser/scripts/prepare-home-speech.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add Soulu target and assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force browser/cef/soulu cef-project/examples/soulu
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/ui | Out-Null
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/vpn | Out-Null
          Copy-Item -Recurse -Force browser/ui/* cef-project/examples/soulu/assets/ui/
          Copy-Item -Recurse -Force browser/vpn/* cef-project/examples/soulu/assets/vpn/
          Add-Content cef-project/examples/CMakeLists.txt "`nadd_subdirectory(soulu)`n"

      - name: Build verified Xray and Sudoku components and VPN helper
        shell: pwsh
        run: |
          ./browser/scripts/prepare-vpn-components.ps1 -Destination "$env:GITHUB_WORKSPACE/cef-project/examples/soulu/assets/vpn/native-host"

      - name: Use CEF-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CEF Python compatibility package
        shell: pwsh
        run: python -m pip install --disable-pip-version-check six pillow

      - name: Verify all production branding exports
        shell: pwsh
        run: python browser/scripts/verify-branding.py

      - name: Restore compiled Rust dependencies
        id: rust_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            browser/cef/soulu/adblock/target
            cef-build/examples/soulu/adblock
          key: adblock-windows-rust-1.99-${{ hashFiles('browser/cef/soulu/adblock/Cargo.lock', 'browser/cef/soulu/adblock/src/**') }}
          restore-keys: adblock-windows-rust-1.99-

      - name: Compile and test the pinned AdBlock engine
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          if ($env:AUTOMATED_RELEASE -ne 'true') {
            cargo test --locked --manifest-path browser/cef/soulu/adblock/Cargo.toml
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CEF
        shell: pwsh
        run: |
          cmake -S cef-project -B cef-build -A x64 -DUSE_SANDBOX=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify fresh CEF archive and distribution resources
        shell: pwsh
        run: |
          $archive = Get-ChildItem cef-project/third_party/cef -Filter '*.tar.bz2'
          if (@($archive).Count -ne 1 -or $archive.Name -cne $env:SonaCefArchiveName -or (Get-FileHash $archive.FullName -Algorithm SHA1).Hash.ToLowerInvariant() -cne $env:SonaCefArchiveSha1) {
            throw 'Downloaded CEF archive does not match the selected distribution'
          }
          $distribution = Get-ChildItem cef-project/third_party/cef -Directory
          if (@($distribution).Count -ne 1) { throw 'Mixed CEF distributions' }
          Get-ChildItem $distribution.FullName -Recurse -File | Select-Object FullName, Length | ConvertTo-Json | Set-Content cef-distribution-files.json

      - name: Build Soulu
        id: native_build
        shell: pwsh
        run: |
          cmake --build cef-build --config Release --target soulu --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          "build_dir=$($exe.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Save compiled Rust dependencies
        if: steps.native_build.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            browser/cef/soulu/adblock/target
            cef-build/examples/soulu/adblock
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Verify loaded engine and every CEF runtime component
        shell: pwsh
        run: |
          $distribution = Get-ChildItem cef-project/third_party/cef -Directory
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir $env:build_dir -DistributionDir $distribution.FullName -ReportPath (Join-Path $env:build_dir 'engine-version.json')
          Remove-Item -LiteralPath (Join-Path $env:build_dir 'cef-runtime-list.txt')

      - name: Verify installed Chrome and Edge profiles and all native import paths
        shell: pwsh
        run: |
          python -m pip install playwright websocket-client pillow comtypes pywinauto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -Force -ItemType Directory browser/artifacts | Out-Null
          python browser/scripts/test-browser-import-native.py "$env:build_dir/Soulu.exe" browser/artifacts/browser-import-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-browser-import.py "$env:build_dir/Soulu.exe" browser/artifacts/browser-import-integration.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-import-installed-browsers.py "$env:build_dir/Soulu.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-browser-import-files.py "$env:build_dir/Soulu.exe" browser/artifacts/browser-import-files.json
          exit $LASTEXITCODE

      - name: Package and verify Windows x64 CEF preview
        shell: pwsh
        working-directory: browser
        run: |
          $version = & ./scripts/get-soulu-version.ps1
          $out = Join-Path $PWD "artifacts/preview"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = Get-ChildItem -LiteralPath $env:build_dir |
            Where-Object { $_.Extension -notin @('.lib','.pdb','.exp','.ilk') }
          $zip = Join-Path $out "Sona-Preview-$version-CEF-x64.zip"
          Compress-Archive -LiteralPath $files.FullName -DestinationPath $zip -CompressionLevel Fastest
          $expanded = Join-Path $env:RUNNER_TEMP "sona-cef-$env:GITHUB_RUN_ID"
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          & ./scripts/verify-cef-engine.ps1 -BuildDir $expanded -ReportPath (Join-Path $out 'engine-version.json')
          if (!(Test-Path -LiteralPath (Join-Path $expanded 'ui/sona-home.png'))) {
            throw 'The Sona home asset is missing from the archive'
          }
          Move-Item -LiteralPath (Join-Path $expanded 'Soulu.exe') -Destination (Join-Path $expanded 'Sona Preview.exe')
          Remove-Item -LiteralPath $zip
          Compress-Archive -Path "$expanded/*" -DestinationPath $zip -CompressionLevel Fastest
          $setup = Join-Path $out "Sona-Preview-$version-CEF-x64-Setup.exe"
          $env:CONNECT_INSTALLER_CI_TEST = "1"
          & ./scripts/build-connect-installer.ps1 -PayloadPath $zip -Version $version -OutFile $setup
          $manifest = Get-Content -LiteralPath "$setup.build.json" -Raw | ConvertFrom-Json
          if ($manifest.payloadSHA256 -ne (Get-FileHash -LiteralPath $zip).Hash.ToLowerInvariant() -or
              $manifest.sha256 -ne (Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant()) {
            throw 'Installer or payload failed SHA-256 verification'
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$hash *$(Split-Path -Leaf $zip)", "$installerHash *$(Split-Path -Leaf $setup)") |
            Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          @"
          Sona Preview $version (CEF), Windows x64. CEF 156.0.30 / Chromium 156.0.8078.96.
          Доработаны переходы Настроек, разворот движения панели закладок и совместное движение адресной строки и кнопок компактного тулбара. Плавность на физическом Windows-дисплее не оценивалась.
          Исходный коммит: 767e11908299a09838f3209c0f36ffca4bc1756e
          "@ | Set-Content (Join-Path $PWD 'artifacts/cef-preview-release.md') -Encoding utf8

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sona-Preview-1.156.0.30.84-CEF-x64-Setup
          path: |
            browser/artifacts/preview/*-Setup.exe
            browser/artifacts/preview/*-Setup.exe.build.json
            browser/artifacts/preview/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
