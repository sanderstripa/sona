name: Check native Windows Acrylic independently of Gecko
on:
  push:
    branches: [codex/sona-acrylic-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python gecko/tests/native-acrylic-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acrylic-probe
          path: acrylic-*.png
